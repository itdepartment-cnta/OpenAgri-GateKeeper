# Adaptado por CNTA desde el compose de upstream (conservado en
# docker-compose.yml.upstream).
#
# Cambios respecto a upstream:
#   - red openagri_oa_network -> web-network, conservando el alias 'gatekeeper'.
#     El alias importa: INTERNAL_GK_URL vale por defecto http://gatekeeper:8001/
#     y GateKeeper se llama a si mismo por esa URL durante el login.
#   - restart: no -> unless-stopped
#   - imagen local en vez de ghcr.io
services:
  web:
    build:
      context: .
    image: cnta/openagri-gatekeeper:local
    container_name: django_gatekeeper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www
      - asset_volume:/var/www/assets
      - media_volume:/var/www/media
      - logs_volume:/var/www/logs
    networks:
      web-network:
        aliases:
          - gatekeeper
    ports:
      - "8001:8001"

volumes:
  asset_volume:
  media_volume:
  logs_volume:

networks:
  web-network:
    external: true
